<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EQ Legends — Gear &amp; Exaltation Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#080b14; --panel:#111a2b; --panel2:#182338; --raised:#1f2c45;
  --edge:#2b3a57; --edge2:#3d5079;
  --bone:#e7e1d0; --dim:#8b96ad; --faint:#5d6880;
  --brass:#c9a227; --brass-dim:#7d6519;
  --arcane:#8b6cf0; --arcane-dim:#4a3a86;
  --ok:#4f9d70; --bad:#c9544a; --warn:#d08b3c;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --disp:'Cinzel',Georgia,serif;
  --ui:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 15% -10%, #16233d 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #1d1733 0%, transparent 55%),
    var(--void);
  color:var(--bone); font-family:var(--ui); font-size:14px; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:2px}

/* ---------- added: char sheet / sort / tier ---------- */
.sheet{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px;margin-top:4px}
.sheet th{font-family:var(--ui);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);font-weight:500;text-align:right;padding:3px 5px;border-bottom:1px solid var(--edge)}
.sheet th:first-child{text-align:left}
.sheet td{padding:2px 5px;text-align:right;border-bottom:1px solid rgba(43,58,87,.4)}
.sheet td:first-child{text-align:left;color:var(--dim);font-family:var(--ui);font-size:11px}
.sheet td.g{color:var(--faint)}
.sheet td.gear{color:var(--arcane)}
.sheet td.tot{color:var(--bone);font-weight:500}
.sheet td.over{color:var(--warn)}
.sheet tr.key td:first-child{color:var(--brass)}
.badge{display:inline-block;font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 5px;border-radius:2px;border:1px solid var(--warn);color:var(--warn);margin-left:6px}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.fbar{display:flex;gap:6px;align-items:center;padding:6px 0 2px}
.fbar .fbtn{flex:1;text-align:left;background:var(--panel2);border:1px solid var(--edge);
  padding:6px 9px;border-radius:3px;font-size:12px;color:var(--dim);display:flex;
  justify-content:space-between;align-items:center;gap:8px}
.fbar .fbtn:hover{border-color:var(--edge2)}
.fbar .fbtn.on{border-color:var(--brass);color:var(--bone)}
.fbar .fbtn .cnt{color:var(--brass);font-family:var(--mono);font-size:11px}
.fbar .clr{border:1px solid var(--edge);border-radius:3px;padding:6px 8px;font-size:11px;color:var(--faint)}
.fbar .clr:hover{color:var(--bad);border-color:var(--bad)}
.zpanel{border:1px solid var(--edge);border-radius:3px;background:rgba(8,11,20,.5);
  padding:8px;margin-bottom:6px}
.zpanel input[type=search]{width:100%;margin-bottom:7px}
.zlist{display:flex;flex-wrap:wrap;gap:4px;max-height:196px;overflow-y:auto}
.zchip{border:1px solid var(--edge);border-radius:2px;padding:3px 7px;font-size:11px;
  color:var(--dim);display:flex;gap:6px;align-items:center;white-space:nowrap}
.zchip:hover{border-color:var(--edge2);color:var(--bone)}
.zchip.on{background:var(--brass-dim);border-color:var(--brass);color:var(--bone)}
.zchip .n{font-family:var(--mono);font-size:10px;color:var(--faint)}
.zchip.on .n{color:var(--bone)}
.zchip.dim{opacity:.45}
.zmore{font-size:10px;color:var(--faint);padding:4px 2px;width:100%}
.sortbar{display:flex;gap:6px;align-items:center;padding:8px 0 4px}
.sortbar label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.sortbar select{flex:1;min-width:0}
.xpbar{display:flex;gap:6px;align-items:center;margin-top:8px;font-family:var(--mono);font-size:11px}
.xpbar input[type=range]{flex:1;accent-color:var(--brass)}
.xpbar .xpv{color:var(--brass);min-width:74px;text-align:right}
.tierpick{display:flex;flex-wrap:wrap;gap:3px}
.tierpick button{background:var(--panel2);border:1px solid var(--edge);color:var(--dim);
  font-size:10px;font-family:var(--mono);padding:3px 6px;border-radius:2px}
.tierpick button.on{background:var(--brass-dim);border-color:var(--brass);color:var(--bone)}
.tierpick button.gated{opacity:.55}
.delta{color:var(--ok)}
.delta.neg{color:var(--bad)}

/* ---------- added: BiS weights ---------- */
.wbody{padding:12px 14px}
.wmode{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.wmode .mbtn{background:var(--panel2);border:1px solid var(--edge);color:var(--dim);
  font-size:11px;padding:5px 10px;border-radius:3px}
.wmode .mbtn.on{background:var(--brass-dim);border-color:var(--brass);color:var(--bone)}
.wmode .spacer{margin-left:auto}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.wf{display:flex;flex-direction:column;gap:2px;background:var(--panel2);
  border:1px solid var(--edge);border-radius:3px;padding:5px 7px}
.wf.hot{border-color:var(--brass-dim)}
.wf label{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.wf.hot label{color:var(--brass)}
.wf input{background:transparent;border:none;color:var(--bone);font-family:var(--mono);
  font-size:13px;width:100%;padding:1px 0;-moz-appearance:textfield}
.wf input:focus{outline:none;color:var(--brass)}
.wf input::-webkit-outer-spin-button,.wf input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
.wf .hint{font-size:8px;color:var(--faint);letter-spacing:.04em}
.wact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:11px;
  padding-top:11px;border-top:1px solid var(--edge)}
.wact .scope{font-size:10.5px;color:var(--faint);line-height:1.5;flex-basis:100%}
.wact .scope b{color:var(--brass)}
.planbar{display:flex;gap:8px;align-items:center;margin-top:9px;font-family:var(--mono);font-size:11px}
.planbar input[type=range]{flex:1;accent-color:var(--brass);max-width:220px}
.planbar .pv{color:var(--brass);min-width:34px}
.planbar .lbl{font-family:var(--ui);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
.slot .flag.lk{border-color:var(--arcane);color:var(--arcane)}
.slot.locked{border-color:var(--arcane-dim)}
.lockrow{display:flex;gap:8px;padding:0 12px 12px}
.lockrow button{flex:1;background:var(--panel2);border:1px solid var(--edge);
  border-radius:3px;padding:7px;font-size:11px;color:var(--dim)}
.lockrow button.on{border-color:var(--arcane);color:var(--arcane)}
.score{color:var(--brass);font-family:var(--mono)}
.row-stat .hint{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

/* ---------- header ---------- */
header{
  border-bottom:1px solid var(--edge);
  background:linear-gradient(180deg,rgba(20,30,50,.95),rgba(8,11,20,.7));
  padding:14px 22px; display:flex; gap:22px; align-items:center; flex-wrap:wrap;
  position:sticky; top:0; z-index:40; backdrop-filter:blur(8px);
}
.brand{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.06em;
  color:var(--bone); white-space:nowrap}
.brand span{color:var(--brass)}
.tagline{font-size:11px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;
  border-left:1px solid var(--edge);padding-left:14px}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.ctl{display:flex;flex-direction:column;gap:3px}
.ctl label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
select,input[type=search]{
  background:var(--panel2);border:1px solid var(--edge);color:var(--bone);
  padding:6px 8px;border-radius:3px;font-family:var(--ui);font-size:12px;min-width:96px;
}
select:hover{border-color:var(--edge2)}

.btn{
  background:var(--raised);border:1px solid var(--edge2);padding:7px 12px;border-radius:3px;
  font-size:12px;font-weight:500;letter-spacing:.03em;transition:.15s;
}
.btn:hover{background:var(--edge);border-color:var(--brass-dim)}
.btn-brass{border-color:var(--brass-dim);color:var(--brass)}
.btn-brass:hover{background:#2a2410}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;
  padding:22px;max-width:1500px;margin:0 auto;align-items:start}
@media(max-width:1080px){.wrap{grid-template-columns:1fr}}

.card{background:linear-gradient(180deg,var(--panel),#0d1523);
  border:1px solid var(--edge);border-radius:5px}
.card-h{padding:10px 14px;border-bottom:1px solid var(--edge);
  display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.015)}
.card-h h2{font-family:var(--disp);font-size:13px;letter-spacing:.1em;font-weight:500;
  text-transform:uppercase;color:var(--bone)}
.card-h .sub{font-size:10px;color:var(--faint);margin-left:auto;letter-spacing:.08em}

/* ---------- paper doll ---------- */
.doll{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:14px}
@media(max-width:560px){.doll{grid-template-columns:repeat(2,1fr)}}

.slot{
  position:relative;background:var(--panel2);border:1px solid var(--edge);
  border-radius:3px;padding:7px 8px;min-height:60px;text-align:left;
  display:flex;flex-direction:column;gap:3px;transition:.13s;overflow:hidden;
}
.slot:hover{border-color:var(--edge2);background:var(--raised);transform:translateY(-1px)}
.slot.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass-dim),0 0 18px -6px var(--brass)}
.slot.filled{background:linear-gradient(150deg,var(--raised),#141d30)}
.slot.any{border-style:dashed;border-color:var(--arcane-dim)}
.slot.any.filled{border-style:solid}
.slot.bad{border-color:var(--bad);box-shadow:0 0 0 1px rgba(201,84,74,.4)}
.slot-name{font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.slot.filled .slot-name{color:var(--brass-dim)}
.slot-item{font-size:11.5px;line-height:1.25;color:var(--bone);font-weight:500}
.slot-empty{font-size:11px;color:#39425a;font-style:italic}
.slot-meta{display:flex;gap:4px;align-items:center;margin-top:auto;flex-wrap:wrap}
.lvl{font-family:var(--mono);font-size:9px;color:var(--brass);border:1px solid var(--brass-dim);
  border-radius:2px;padding:0 3px}
.gems{display:flex;gap:2px}
.gem{width:5px;height:5px;border-radius:50%;background:#2a3450;border:1px solid #38456a}
.gem.on{background:var(--arcane);border-color:var(--arcane);box-shadow:0 0 5px var(--arcane)}
.gem.on.orn{background:var(--brass);border-color:var(--brass);box-shadow:0 0 5px var(--brass)}
.flag{font-size:8px;letter-spacing:.1em;padding:0 3px;border-radius:2px;
  border:1px solid currentColor;text-transform:uppercase}
.flag.lore{color:var(--warn)} .flag.err{color:var(--bad)}

/* ---------- rules log ---------- */
.log{padding:10px 14px;display:flex;flex-direction:column;gap:6px;max-height:230px;overflow:auto}
.issue{display:flex;gap:8px;font-size:11.5px;line-height:1.45;padding:7px 9px;
  border-radius:3px;border-left:2px solid;background:rgba(255,255,255,.02)}
.issue.err{border-color:var(--bad);color:#f0b5af}
.issue.warn{border-color:var(--warn);color:#e8c48f}
.issue.ok{border-color:var(--ok);color:#9ed4b4}
.issue b{color:var(--bone);font-weight:600}
.issue .ico{font-family:var(--mono);opacity:.8}

/* ---------- totals ---------- */
.totals{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:1px;
  background:var(--edge);border-top:1px solid var(--edge)}
.tot{background:var(--panel);padding:7px 9px}
.tot dt{font-size:8.5px;letter-spacing:.13em;color:var(--faint);text-transform:uppercase}
.tot dd{font-family:var(--mono);font-size:14px;color:var(--bone);margin-top:1px}
.tot dd.z{color:#39425a}

/* ---------- drawer ---------- */
.drawer{position:sticky;top:82px}
.drawer-body{max-height:calc(100vh - 140px);overflow:auto}
.search{padding:9px 12px;border-bottom:1px solid var(--edge)}
.chips{display:flex;gap:4px;padding:0 12px 9px;flex-wrap:wrap}
.chip{font-size:10px;letter-spacing:.06em;padding:3px 8px;border-radius:10px;
  border:1px solid var(--edge2);color:var(--faint);background:var(--panel)}
.chip:hover{color:var(--bone)}
.chip.on{background:var(--brass);color:#1a1405;border-color:var(--brass);font-weight:600}
.search input{width:100%}

.row{display:flex;flex-direction:column;gap:4px;padding:9px 13px;
  border-bottom:1px solid rgba(43,58,87,.5);cursor:pointer;text-align:left;width:100%;transition:.1s}
.row:hover{background:var(--panel2)}
.row.ineligible{opacity:.42}
.row.ineligible:hover{opacity:.7}
.row-top{display:flex;gap:8px;align-items:baseline}
.row-name{font-size:12.5px;font-weight:500;flex:1}
.row-stat{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap}
.row-sub{font-size:10.5px;color:var(--faint);line-height:1.4}
.row-drop{font-size:10px;color:var(--brass-dim)}
.row-drop b{color:var(--brass);font-weight:500}
.pill{font-size:8px;letter-spacing:.09em;text-transform:uppercase;padding:1px 4px;
  border-radius:2px;border:1px solid;white-space:nowrap}
.pill.lore{color:var(--warn);border-color:var(--warn)}
.pill.magic{color:#6f9fd0;border-color:#3d5f80}
.pill.quest{color:var(--ok);border-color:#2f6047}
.pill.no{color:var(--bad);border-color:#7a3630}
.pill.foc{color:var(--arcane);border-color:var(--arcane-dim)}
.pill.craft{color:#5fb0a8;border-color:#2f6b66}
.pill.ooe{color:#e0685c;border-color:#8f3a32;background:rgba(224,104,92,.08)}
.pill.chg{color:#d8a548;border-color:#7a5f22}
.chip.era.on{background:var(--ok);color:#08160e;border-color:var(--ok)}
.pill.vend{color:#9a8fb8;border-color:#4d4470}

.empty{padding:30px 18px;text-align:center;color:var(--faint);font-size:12px;line-height:1.6}
.empty b{display:block;font-family:var(--disp);color:var(--dim);font-size:13px;
  letter-spacing:.08em;margin-bottom:6px}

/* ---------- item tooltip (the EQ item window) ---------- */
.tip{margin:12px;border:1px solid var(--brass-dim);border-radius:3px;
  background:linear-gradient(165deg,#1b1608,#0f1420 60%);padding:11px 13px}
.tip-name{font-family:var(--disp);font-size:14px;color:var(--brass);letter-spacing:.05em;
  margin-bottom:7px}
.tip pre{font-family:var(--mono);font-size:11px;line-height:1.65;color:var(--bone);
  white-space:pre-wrap;word-break:break-word}
.tip .t-tag{color:var(--warn)} .tip .t-key{color:var(--dim)}
.tip .t-eff{color:var(--arcane)} .tip .t-foc{color:#6fb0d8}

/* ---------- exaltation rail (signature) ---------- */
.rail{margin:12px;border:1px solid var(--edge);border-radius:4px;overflow:hidden}
.rail-h{padding:9px 12px;background:var(--panel2);border-bottom:1px solid var(--edge);
  display:flex;align-items:center;gap:10px}
.rail-h h3{font-family:var(--disp);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);font-weight:500}
.lvlpick{margin-left:auto;display:flex;gap:2px}
.lvlpick button{font-family:var(--mono);font-size:10px;padding:2px 6px;border:1px solid var(--edge2);
  border-radius:2px;color:var(--faint);background:var(--panel)}
.lvlpick button:hover{color:var(--bone);border-color:var(--brass-dim)}
.lvlpick button.on{background:var(--brass);color:#1a1405;border-color:var(--brass);font-weight:500}

.exalt{display:flex;gap:10px;align-items:center;padding:9px 12px;
  border-bottom:1px solid rgba(43,58,87,.45);width:100%;text-align:left;transition:.12s}
.exalt:last-child{border-bottom:none}
.exalt:not(.locked){cursor:pointer}
.exalt:not(.locked):hover{background:var(--panel2)}
.exalt.locked{opacity:.4;cursor:not-allowed}
.socket{width:22px;height:22px;flex:none;border-radius:50%;border:1px solid var(--edge2);
  background:#0c1220;display:grid;place-items:center;font-size:9px;color:var(--faint);
  font-family:var(--mono);position:relative}
.exalt.open .socket{border-color:var(--arcane-dim);box-shadow:inset 0 0 6px rgba(139,108,240,.25)}
.exalt.set .socket{background:radial-gradient(circle at 35% 30%,#b9a0ff,var(--arcane));
  border-color:var(--arcane);box-shadow:0 0 9px -1px var(--arcane);color:transparent}
.exalt.set.orn-s .socket{background:radial-gradient(circle at 35% 30%,#f0dc94,var(--brass));
  border-color:var(--brass);box-shadow:0 0 9px -1px var(--brass)}
.ex-txt{flex:1;min-width:0}
.ex-type{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.ex-val{font-size:11.5px;color:var(--bone);margin-top:1px;line-height:1.35}
.ex-val.none{color:#39425a;font-style:italic}
.ex-req{font-family:var(--mono);font-size:9.5px;color:var(--faint);white-space:nowrap}
.ex-clear{font-size:9px;color:var(--faint);padding:2px 5px;border:1px solid var(--edge);
  border-radius:2px}
.ex-clear:hover{color:var(--bad);border-color:var(--bad)}

.note{margin:0 12px 12px;padding:8px 10px;border-radius:3px;font-size:11px;line-height:1.55;
  background:rgba(139,108,240,.07);border-left:2px solid var(--arcane-dim);color:#b9abe8}
.note b{color:#d6cbff}
.note.warn{background:rgba(208,139,60,.07);border-color:var(--warn);color:#e8c48f}
.note.warn b{color:#f3dcb4}

.back{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint);
  padding:8px 13px;border-bottom:1px solid var(--edge);width:100%;text-align:left}
.back:hover{color:var(--brass)}

.data-note{padding:11px 14px;font-size:10.5px;line-height:1.6;color:var(--faint);
  border-top:1px solid var(--edge);background:rgba(0,0,0,.2)}
.data-note b{color:var(--dim)}
.data-note code{font-family:var(--mono);color:var(--brass-dim);font-size:10px}
a{color:var(--brass-dim)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">EQ<span>L</span> Gear Planner</div>
  <div class="tagline">Exaltation &amp; loadout modelling</div>
  <div class="hdr-right">
    <div class="ctl"><label for="c1">Class 1</label><select id="c1"></select></div>
    <div class="ctl"><label for="c2">Class 2</label><select id="c2"></select></div>
    <div class="ctl"><label for="c3">Class 3</label><select id="c3"></select></div>
    <div class="ctl"><label for="race">Race</label><select id="race"></select></div>
    <button class="btn btn-brass" id="load">Load item data</button>
    <button class="btn" id="loadchar" title="Override the built-in race/class attribute table">Load char data</button>
    <input type="file" id="file" accept=".json" hidden>
    <input type="file" id="charfile" accept=".json" hidden>
  </div>
</header>

<div class="wrap">
  <div>
    <section class="card" style="margin-bottom:18px">
      <div class="card-h">
        <h2>Best-in-slot weights</h2>
        <div class="sub" id="wsub"></div>
      </div>
      <div class="wbody" id="wpanel"></div>
    </section>

    <section class="card">
      <div class="card-h">
        <h2>Loadout</h2>
        <div class="sub" id="dollsub">click a slot to fit gear</div>
      </div>
      <div class="doll" id="doll"></div>
      <dl class="totals" id="totals"></dl>
      <div class="data-note" id="zonesum"></div>
    </section>

    <section class="card">
      <div class="card-h"><h2>Character</h2><div class="sub" id="charsub"></div></div>
      <div id="charsheet"></div>
    </section>

    <section class="card" style="margin-top:18px">
      <div class="card-h"><h2>Rules check</h2><div class="sub" id="logsub"></div></div>
      <div class="log" id="log"></div>
    </section>

    <section class="card" style="margin-top:18px">
      <div class="data-note" id="datanote"></div>
    </section>
  </div>

/* ============================================================
   ITEM TIERS 0-10
   Source: eqlwiki.com/Item_Upgrade_System.

   These are NOT scraped, and there is nothing to scrape — every item page on
   the wiki carries one stat block, at tier 0. Tiers are *computed*:

     - each tier is a cumulative +10% to the item's stats
     - the bonus tracks item XP, not the tier number, so it creeps up mid-tier
     - everything rounds down
     - a minimum +1 per stat is guaranteed at the *start of each tier* only;
       mid-tier creep does not get it
     - weight shrinks the same way, floor 0.1; damage scales, delay never does

   Verified against the wiki's own worked example (Umbral Platemail Breastplate,
   AC 30 -> 33 at T1 -> 34 at T1+1xp -> 36 at T2).
   ============================================================ */
const TIER_XP   = [0,1,3,7,15,31,63,127,255,511,1023];   // total xp to sit at tier N
const TIER_NEXT = [1,2,4,8,16,32,64,128,256,512,null];   // xp from tier N to N+1
const MAX_XP = 1023;

/* What one merge is worth. Gear gives the xp it took to reach its own tier;
   motes give a fixed amount but refuse to feed an item above their cap. */
const MOTES = [
  {n:"Infinitesimal",max:0,xp:1},  {n:"Minor",max:1,xp:1},   {n:"Lesser",max:2,xp:2},
  {n:"Potential",max:3,xp:4},      {n:"Major",max:4,xp:5},   {n:"Greater",max:5,xp:6},
  {n:"Superior",max:6,xp:7},       {n:"Grand",max:7,xp:8},   {n:"Ascendant",max:8,xp:9},
  {n:"Infinite",max:9,xp:10},
];

const tierOf = xp => { let t = 0; for(let i=0;i<11;i++) if(xp >= TIER_XP[i]) t = i; return t; };

/** cumulative stat bonus as a fraction, e.g. 0.15 for +15% */
function cumBonus(xp){
  const t = tierOf(xp);
  if(t >= 10) return 1;
  const into = xp - TIER_XP[t], need = TIER_NEXT[t];
  return (t*10 + (into/need*100)/10) / 100;
}

/** one stat, tier-0 value -> value at this xp */
function scaleStat(v, xp){
  if(!v) return v;
  const t = tierOf(xp), cum = cumBonus(xp);
  if(v > 0){
    const atTier = Math.max(Math.floor(v * (1 + t/10)), v + t);  // +1/tier guarantee
    return Math.max(atTier, Math.floor(v * (1 + cum)));          // mid-tier creep
  }
  /* UNVERIFIED: the wiki publishes no negative-stat example. It says the +1 is a
     bonus and that everything rounds down; applied literally that deepens a
     penalty as you upgrade. That is what this does. If you see otherwise
     in-game, this is the line to change. */
  return -Math.floor(Math.abs(v) * (1 + cum));
}

function scaledItem(item, xp){
  const stats = {};
  for(const [k,v] of Object.entries(item.stats||{})) stats[k] = scaleStat(v, xp);
  const o = {stats, tier:tierOf(xp), xp, cum:cumBonus(xp)};
  if(item.dmg) o.dmg = scaleStat(item.dmg, xp);
  if(item.delay) o.delay = item.delay;                 // never scales
  if(item.wt != null) o.wt = Math.max(0.1, Math.round(item.wt * (1 - cumBonus(xp)) * 10) / 10);
  return o;
}

/* ---------------- rules engine ---------------- */
const active = () => [...new Set(state.classes.filter(Boolean))];

/** class list intersection, honouring "ALL" */
function cx(a, b){
  if(!a || a.includes("ALL") || isAllExcept(a)) return b ? [...b] : ["ALL"];
  if(!b || b.includes("ALL") || isAllExcept(b)) return [...a];
  return a.filter(c => b.includes(c));
}
/** slot list intersection */
function sx(a, b){
  if(!a) return b ? [...b] : null;
  if(!b) return [...a];
  return a.filter(s => b.includes(s));
}
/* The scraper emits ["ALL_EXCEPT","IKS",...] for "Race: ALL except IKS". v1
   flattened those to plain ALL and silently lost the exclusion. */
const isAllExcept = l => l && l[0] === "ALL_EXCEPT";
const excluded    = l => l.slice(1);

const usableBy = (list, act) => {
  if(!list || !list.length || list.includes("ALL")) return true;
  if(isAllExcept(list)) return act.some(c => !excluded(list).includes(c));
  return list.some(c => act.includes(c));
};
const raceOk = (item, race) => {
  const r = item.races;
  if(!r || !r.length || r.includes("ALL") || race === "ALL") return true;
  if(isAllExcept(r)) return !excluded(r).includes(race);
  return r.includes(race);
};
const showList = l => isAllExcept(l) ? "ALL except " + excluded(l).join(" ") : l.join(" ");

/**
 * The heart of it: an item's *effective* class + slot restrictions after
 * exaltations are socketed. Per eqlwiki: "Exaltations carry their own class and
 * slot restrictions, and these are applied to the item they are inserted into."
 */
function effective(entry){
  const base = byId[entry.itemId];
  if(!base) return null;
  const sc = scaledItem(base, entry.xp || 0);
  let classes = base.classes.slice(), slots = base.slots.slice();
  const applied = [];
  for(const ex of EXALTS){
    if(ex.k === "ornament") continue;            // cosmetic, carries nothing
    const srcId = entry.exalts?.[ex.k];
    if(!srcId) continue;
    const src = byId[srcId];
    if(!src) continue;
    const bc = classes.slice(), bs = slots.slice();
    classes = cx(classes, src.classes);
    slots   = sx(slots, src.slots);
    applied.push({type:ex, src,
      narrowedClass: bc.length !== classes.length || (bc.includes("ALL") && !classes.includes("ALL")),
      narrowedSlot: bs.length !== slots.length});
  }
  return {base, classes, slots, applied, sc};
}

/** can this item physically go in this slot position? */
function fitsSlot(item, slotKey){
  const s = SLOTS.find(x => x.k === slotKey);
  if(!s) return false;
  if(s.a === "*") return true;                   // Any slot takes anything equippable
  return item.slots.includes(s.a);
}

function issues(){
  const out = [], act = active();
  // LORE — only one copy may be equipped
  const loreCount = {};
  for(const [k, e] of Object.entries(state.equipped)){
    const it = byId[e.itemId]; if(!it) continue;
    if(it.tags.includes("LORE") || it.tags.includes("LORE_EQUIPPED"))
      (loreCount[it.name] ||= []).push(k);
  }
  for(const [nm, ks] of Object.entries(loreCount))
    if(ks.length > 1)
      out.push({t:"err", ico:"LORE", m:`<b>${nm}</b> is LORE — you may only equip one. Currently in ${ks.length} slots (${ks.join(", ")}).`});

  for(const [k, e] of Object.entries(state.equipped)){
    const eff = effective(e); if(!eff) continue;
    const nm = eff.base.name;
    if(!usableBy(eff.classes, act))
      out.push({t:"err", ico:"CLASS", m:`<b>${nm}</b> in ${k} is unusable — after exaltations it needs ${eff.classes.join("/") || "no class"}; you run ${act.join("/")}.`});
    if(outOfEra(eff.base))
      out.push({t:"warn", ico:"ERA", m:`<b>${nm}</b> is ${eff.base.era||"out of era"} — not obtainable in EQ Legends yet. Plan around it, don't count on it.`});
    if(!raceOk(eff.base, state.race))
      out.push({t:"err", ico:"RACE", m:`<b>${nm}</b> is restricted to ${eff.base.races.join("/")} — you are ${RACES[state.race]}.`});

    const s = SLOTS.find(x => x.k === k);
    if(s.a !== "*" && !eff.slots.includes(s.a))
      out.push({t:"err", ico:"SLOT", m:`<b>${nm}</b> can no longer sit in ${s.n} — an exaltation narrowed it to ${eff.slots.join("/") || "nothing"}.`});
    if(s.a === "*" && eff.slots.length && !eff.slots.includes("*"))
      out.push({t:"warn", ico:"ANY", m:`<b>${nm}</b> is in an Any slot carrying ${eff.slots.join("/")} restrictions from an exaltation. Any slots take the item, but check it in-game.`});

    for(const a of eff.applied){
      if(a.narrowedClass)
        out.push({t:"warn", ico:"EXLT", m:`<b>${a.src.name}</b>'s ${a.type.n.toLowerCase()} narrowed ${nm} to ${eff.classes.join("/")}.`});
      if(a.narrowedSlot)
        out.push({t:"warn", ico:"EXLT", m:`<b>${a.src.name}</b>'s ${a.type.n.toLowerCase()} narrowed ${nm} to ${eff.slots.join("/")} only.`});
      if(a.src.id === e.itemId) continue;
      out.push({t:"ok", ico:"FARM", m:`Extracting <b>${a.type.n}</b> needs a second <b>${a.src.name}</b> at +${a.type.req}. ${dropLine(a.src) || "No drop data."}`});
    }
  }
  if(!out.length) out.push({t:"ok", ico:"OK", m:"No conflicts. Every equipped piece is legal for this class, race and slot."});
  return out;
}

/* ---------------- helpers ---------------- */
function dropLine(item){
  // Prefer mob-level drops; fall back to zone categories; then to how it's obtained.
  if(item.drops?.length){
    const d = item.drops[0];
    const extra = item.drops.length > 1 ? ` +${item.drops.length - 1} more` : "";
    return `<b>${esc(d.zone)}</b>${d.mobs.length ? " — " + d.mobs.slice(0,2).map(esc).join(", ") : ""}${extra}`;
  }
  const src = item.source || [];
  const bits = [];
  if(src.includes("craft"))  bits.push(`<b>Crafted</b>`);
  if(src.includes("vendor")) bits.push(`Vendor`);
  if(src.includes("quest"))  bits.push(`Quest`);
  if(src.includes("forage")) bits.push(`Foraged`);
  if(src.includes("ground")) bits.push(`Ground spawn`);
  if(item.zones?.length){
    const z = item.zones.slice(0,2).map(esc).join(", ");
    bits.push(`<b>${z}</b>${item.zones.length>2?` +${item.zones.length-2}`:""}`);
  }
  return bits.join(" · ");
}

/* ---------------- sorting ----------------
   Ranking is done on tier-0 stats. Tiers scale everything by the same
   percentage, so the order barely moves — the exception is the +1/tier
   minimum, which quietly favours items with many small stats over one big one.
   Worth knowing if you're squinting at the top of the list. */
const SORTS = [
  ["bis",      "BiS score (my weights)"],
  ["fit",      "Best fit (usable, then AC)"],
  ["weighted", "Best for my classes"],
  ["ratio",    "Weapon ratio (dmg/delay)"],
  ["AC","AC"], ["HP","HP"], ["MANA","Mana"],
  ["STR","STR"], ["STA","STA"], ["AGI","AGI"], ["DEX","DEX"],
  ["WIS","WIS"], ["INT","INT"], ["CHA","CHA"],
  ["sumattr",  "Sum of all attributes"],
  ["wt",       "Lightest"],
];

/** Heuristic — chardata.stat_weights, averaged across the active trio.
    Not game data. The casting-stat mapping under it is; the rest is opinion. */
function weightFor(act){
  const w = {};
  act.forEach(c => {
    const t = CHAR.stat_weights?.[c] || {};
    for(const [k,v] of Object.entries(t)) w[k] = Math.max(w[k]||0, v);
  });
  return w;
}

function sortKey(i, act, slotKey){
  const s = i.stats || {};
  switch(state.sort){
    case "bis":      return slotScore(i, slotKey || state.view.slot);
    case "fit":      return s.AC || 0;
    case "ratio":    return i.dmg && i.delay ? i.dmg / i.delay : -1;
    case "sumattr":  return ATTRS.reduce((a,k) => a + (s[k]||0), 0);
    case "wt":       return i.wt == null ? -999 : -i.wt;
    case "weighted": {
      const w = weightFor(act);
      return Object.entries(w).reduce((a,[k,v]) => a + (s[k]||0) * v, 0);
    }
    default:         return s[state.sort] || 0;
  }
}

/* ============================================================
   BiS SCORING
   One number per item, per slot, under one weight vector. The drawer's "BiS
   score" sort and the auto-equip button read the same function, so the list
   order IS the order auto-equip picks in — if you disagree with a pick, retune
   a weight and watch both move together.

   Weights are yours. The auto vector below is derived from chardata's
   stat_weights (max across your trio, same rule the old "Best for my classes"
   sort used) and is only a starting point — it is opinion, not game data.
   ============================================================ */
const W_STATS = ["AC","HP","MANA","STR","STA","AGI","DEX","WIS","INT","CHA"];
const W_SPECIAL = [
  ["RATIO",   "per 1.0 dmg/delay"],
  ["OFFHAND", "share of offhand dmg that lands"],
  ["EFFECT",  "each focus/proc/click/worn"],
  ["WT",      "penalty per 1 weight"],
];
const W_KEYS = [...W_STATS, ...W_SPECIAL.map(([k]) => k)];

const MELEE = new Set(["WAR","PAL","SHD","RNG","MNK","ROG","BRD","BER","BST"]);
const DUAL  = new Set(["WAR","RNG","MNK","ROG","BRD","BER","BST"]);
const isWeapon  = i => !!(i.dmg && i.delay);
const isTwoHand = i => /^2H/i.test(i.skill || "");
const effectCount = i => ["focus","proc","click","worn"].filter(t => i.effects?.[t]).length;

/** the class-derived starting vector */
function derivedWeights(){
  const act = active(), w = {};
  W_KEYS.forEach(k => w[k] = 0);
  act.forEach(c => {
    const t = CHAR.stat_weights?.[c] || {};
    for(const [k,v] of Object.entries(t)) if(k in w) w[k] = Math.max(w[k], v);
  });
  /* No melee in the trio means nothing is meleeing, so a weapon's ratio is
     worth nothing and both hands are pure stat sticks — which is why a caster
     almost never wants a two-hander: it costs a whole slot of stats and returns
     damage the build will not use. */
  w.RATIO   = act.some(c => MELEE.has(c)) ? 100 : 0;
  w.OFFHAND = 0.6;
  w.EFFECT  = 3;
  w.WT      = 0;
  return w;
}

/** the vector actually in force */
function activeWeights(){
  return state.wMode === "custom" && state.weights ? state.weights : derivedWeights();
}

/** In auto mode the fields track your classes, so flipping to Custom starts
    from exactly what you were just looking at rather than a stale vector. */
function syncWeights(){
  if(state.wMode !== "custom" || !state.weights) state.weights = derivedWeights();
}

/**
 * Score one item for one slot, split into its three parts. Stats are scaled to
 * `planTier` first, so the ranking answers "best once I've levelled it", not
 * "best out of the box" — which matters because the +1-per-tier floor quietly
 * favours items carrying several small stats over one big one.
 *
 * The split exists because an offhand is not worth a flat fraction of a
 * mainhand. Its *stats* are worth exactly what they say — a +10 STA shield is
 * +10 STA whether or not you ever swing it — while its *damage* is worth much
 * less, because the offhand swings on a dual-wield check rather than every
 * round. Discounting the whole score would quietly tax the stats too.
 */
function scoreParts(i, slotKey, w = activeWeights(), xp = TIER_XP[state.planTier] || 0){
  const sc = scaledItem(i, xp);
  let stat = 0;
  for(const k of W_STATS) stat += (sc.stats[k] || 0) * (w[k] || 0);
  if(w.WT && sc.wt != null) stat -= sc.wt * w.WT;
  const weaponSlot = slotKey === "PRIMARY" || slotKey === "SECONDARY" ||
                     slotKey === "RANGE"   || slotKey === "ANY1" || slotKey === "ANY2";
  const ratio = (weaponSlot && sc.dmg && sc.delay) ? (sc.dmg / sc.delay) * (w.RATIO || 0) : 0;
  const effect = effectCount(i) * (w.EFFECT || 0);
  return {stat, ratio, effect, total:stat + ratio + effect};
}
const scoreItem = (i, slotKey, w, xp) => scoreParts(i, slotKey, w, xp).total;

/** How much of an offhand's damage actually lands. Zero for anything that
    can't dual wield at all — a paladin's offhand is a stat stick by definition,
    so its shield competes on AC and nothing else. */
function offhandFactor(w = activeWeights()){
  return active().some(c => DUAL.has(c)) ? (w.OFFHAND ?? 0.6) : 0;
}

/** An offhand's worth: stats and effects in full, damage discounted. */
function offhandValue(i, w = activeWeights(), xp){
  const p = scoreParts(i, "SECONDARY", w, xp);
  return p.stat + p.effect + p.ratio * offhandFactor(w);
}

/** The number a slot is actually ranked on — the browser list and auto-equip
    share it, so the list order stays the order auto-equip picks in. */
function slotScore(i, slotKey, w = activeWeights(), xp){
  return slotKey === "SECONDARY" ? offhandValue(i, w, xp) : scoreItem(i, slotKey, w, xp);
}

/* ---------------- auto-equip ----------------
   Greedy, one slot at a time, in the order below: PRIMARY before SECONDARY so
   a two-hander can veto the offhand, everything before ANY1/ANY2 so the flex
   slots take what's genuinely left over. Greedy is not optimal — a LORE piece
   claimed by an early slot can't be reconsidered by a later one — but it is
   predictable, and you can lock a slot to force the issue. */
const AUTO_ORDER = ["PRIMARY","SECONDARY","RANGE","AMMO","HEAD","FACE","EAR1","EAR2",
  "NECK","SHOULDERS","ARMS","BACK","WRIST1","WRIST2","HANDS","FINGER1","FINGER2",
  "CHEST","LEGS","FEET","WAIST","ANY1","ANY2"];

/** everything the current filters + rules allow into this slot, best first */
function bisCandidates(slotKey, taken = new Set(), opts = {}){
  const act = active(), w = activeWeights();
  const twoHandUp = slotKey === "SECONDARY" && !opts.ignoreTwoHand && (() => {
    const p = state.equipped.PRIMARY;
    return p && byId[p.itemId] && isTwoHand(byId[p.itemId]);
  })();
  if(twoHandUp) return [];

  let pool = DATA.items.filter(i => fitsSlot(i, slotKey));
  if(state.inEra)      pool = pool.filter(i => !outOfEra(i));
  if(state.src.size)   pool = pool.filter(i => (i.source||[]).some(s => state.src.has(s)));
  if(state.zones.size) pool = pool.filter(i => zonesOf(i).some(z => state.zones.has(z)));
  pool = pool.filter(i => usableBy(i.classes, act) && raceOk(i, state.race));
  pool = pool.filter(i => {
    const lore = i.tags.includes("LORE") || i.tags.includes("LORE_EQUIPPED");
    return !(lore && taken.has(i.name));
  });

  /* A melee mainhand wants an actual weapon — a preference, not a filter, so a
     thin pool still shows everything. The offhand needs no such rule: with its
     damage discounted (and zeroed outright for a trio that can't dual wield) a
     shield and a sword compete on the same number, and the better one wins. */
  const prefer = (slotKey === "PRIMARY" && act.some(c => MELEE.has(c))) ? isWeapon : null;

  return pool
    .map(i => ({i, s:slotScore(i, slotKey, w), p:prefer ? (prefer(i) ? 1 : 0) : 0}))
    .sort((a,b) => (b.p - a.p) || (b.s - a.s) || a.i.name.localeCompare(b.i.name));
}

/* ---------------- the hands, decided together ----------------
   The one place greedy slot-at-a-time fails outright: a two-hander doesn't
   just have to beat the best one-hander, it has to beat the one-hander PLUS
   whatever the offhand would have held. Scoring PRIMARY alone never charges
   the two-hander for the slot it eats, which flatters it every time. So both
   hands are resolved as a pair, before either is committed. */
function pickHands(taken = new Set()){
  const w = activeWeights();
  const lore = i => i.tags.includes("LORE") || i.tags.includes("LORE_EQUIPPED");
  const prim = bisCandidates("PRIMARY", taken);
  const twoH = prim.find(c => isTwoHand(c.i)) || null;
  const oneH = prim.find(c => !isTwoHand(c.i)) || null;

  let dw = null;
  if(oneH){
    /* the mainhand claims its own LORE before the offhand shops, or the same
       sword fills both hands */
    const t2 = new Set(taken);
    if(lore(oneH.i)) t2.add(oneH.i.name);
    const off = bisCandidates("SECONDARY", t2, {ignoreTwoHand:true})[0] || null;
    dw = {primary:oneH, offhand:off, total:oneH.s + (off ? off.s : 0)};
  }
  const th = twoH ? {primary:twoH, offhand:null, total:twoH.s} : null;

  if(dw && th) return dw.total >= th.total
    ? {...dw, mode:"dual", rival:th.total} : {...th, mode:"two-hand", rival:dw.total};
  if(dw) return {...dw, mode:"dual", rival:null};
  if(th) return {...th, mode:"two-hand", rival:null};
  return null;
}

/** @param fillOnly leave slots that already hold something alone */
function autoBiS(fillOnly){
  const xp = TIER_XP[state.planTier] || 0;
  const taken = new Set();
  const picked = [];

  // locked slots (and, in fill mode, everything already equipped) claim their LORE first
  for(const [k,e] of Object.entries(state.equipped)){
    const keep = state.locked.has(k) || fillOnly;
    const it = byId[e.itemId];
    if(keep && it && (it.tags.includes("LORE") || it.tags.includes("LORE_EQUIPPED")))
      taken.add(it.name);
  }
  if(!fillOnly) for(const k of Object.keys(state.equipped))
    if(!state.locked.has(k)) delete state.equipped[k];

  /* hands first, as a pair — see pickHands */
  const handsFree = !state.locked.has("PRIMARY") && !state.locked.has("SECONDARY") &&
                    !(fillOnly && (state.equipped.PRIMARY || state.equipped.SECONDARY));
  if(handsFree){
    const hands = pickHands(taken);
    state.handChoice = hands ? {mode:hands.mode, total:hands.total, rival:hands.rival} : null;
    if(hands){
      const put = (k, c) => {
        if(!c) return;
        state.equipped[k] = {itemId:c.i.id, xp,
          exalts:{ornament:null,focus:null,click:null,worn:null,proc:null}};
        if(c.i.tags.includes("LORE") || c.i.tags.includes("LORE_EQUIPPED")) taken.add(c.i.name);
        picked.push(`${k} ${c.i.name} (${c.s.toFixed(0)})`);
      };
      put("PRIMARY", hands.primary);
      put("SECONDARY", hands.offhand);
    }
  }

  for(const k of AUTO_ORDER){
    if(state.locked.has(k)) continue;
    if(fillOnly && state.equipped[k]) continue;
    if(handsFree && (k === "PRIMARY" || k === "SECONDARY")) continue;
    const best = bisCandidates(k, taken)[0];
    if(!best) continue;
    state.equipped[k] = {itemId:best.i.id, xp,
      exalts:{ornament:null,focus:null,click:null,worn:null,proc:null}};
    if(best.i.tags.includes("LORE") || best.i.tags.includes("LORE_EQUIPPED"))
      taken.add(best.i.name);
    picked.push(`${k} ${best.i.name} (${best.s.toFixed(0)})`);
  }
  state.lastAuto = picked;
  render();
}

function statLine(i){
  const p = [];
  if(i.dmg) p.push(`${i.dmg}/${i.delay}`);
  if(i.stats?.AC) p.push(`AC${i.stats.AC}`);
  const hp = i.stats?.HP, mn = i.stats?.MANA;
  if(hp) p.push(`HP${hp>0?"+":""}${hp}`);
  if(mn) p.push(`M${mn>0?"+":""}${mn}`);
  return p.join(" · ");
}
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/** Lead with whatever the list is sorted on, so the ordering is legible. */
function sortStat(i){
  const s = i.stats || {}, base = statLine(i);
  if(state.sort === "fit") return base;
  if(state.sort === "bis"){
    const v = slotScore(i, state.view.slot);
    const cut = state.view.slot === "SECONDARY" && isWeapon(i) && offhandFactor() < 1;
    return `<b class="score">${v.toFixed(0)}</b>${cut?`<span class="hint"> offhand</span>`:""}${base?" · "+base:""}`;
  }
  if(state.sort === "weighted"){
    const v = sortKey(i, active());
    return `<b style="color:var(--brass)">${v.toFixed(0)}</b>${base?" · "+base:""}`;
  }
  if(state.sort === "ratio")
    return i.dmg && i.delay ? `<b style="color:var(--brass)">${(i.dmg/i.delay).toFixed(2)}</b> · ${i.dmg}/${i.delay}` : base;
  if(state.sort === "wt") return `<b style="color:var(--brass)">${i.wt ?? "—"}</b>${base?" · "+base:""}`;
  if(state.sort === "sumattr")
    return `<b style="color:var(--brass)">${ATTRS.reduce((a,k)=>a+(s[k]||0),0)}</b>${base?" · "+base:""}`;
  const v = s[state.sort];
  return `<b style="color:${v?"var(--brass)":"var(--faint)"}">${state.sort} ${v?(v>0?"+":"")+v:"—"}</b>${base?" · "+base:""}`;
}

function tagPills(i){
  let h = "";
  if(i.tags.includes("LORE") || i.tags.includes("LORE_EQUIPPED")) h += `<span class="pill lore">Lore</span>`;
  if(i.tags.includes("MAGIC")) h += `<span class="pill magic">Magic</span>`;
  if(i.tags.includes("QUEST")) h += `<span class="pill quest">Quest</span>`;
  if(i.tags.includes("NO_DROP") || i.tags.includes("NO_TRADE")) h += `<span class="pill no">No drop</span>`;
  if(outOfEra(i)) h += `<span class="pill ooe">Out of era</span>`;
  if(i.charges) h += `<span class="pill chg">${i.charges} charges</span>`;
  if((i.source||[]).includes("craft")) h += `<span class="pill craft">Crafted</span>`;
  if((i.source||[]).includes("vendor")) h += `<span class="pill vend">Vendor</span>`;
  return h;
}

/* ---------------- render: BiS weights ---------------- */
function renderWeights(){
  syncWeights();
  const el = document.getElementById("wpanel");
  const w = activeWeights(), custom = state.wMode === "custom";
  const act = active();

  document.getElementById("wsub").textContent =
    custom ? "custom vector" : `derived from ${act.join(" / ") || "no classes"}`;

  const field = (k, hint) => `<div class="wf ${w[k]?"hot":""}">
    <label for="w_${k}">${k}</label>
    <input type="number" id="w_${k}" data-w="${k}" step="0.1" value="${w[k] ?? 0}">
    ${hint ? `<span class="hint">${hint}</span>` : ""}</div>`;

  let h = `<div class="wmode">
    <button class="mbtn ${custom?"":"on"}" data-wmode="auto">From my classes</button>
    <button class="mbtn ${custom?"on":""}" data-wmode="custom">Custom</button>
    <span class="spacer"></span>
    <button class="mbtn" id="wreset" title="Copy the class-derived vector into the fields">Reset to class defaults</button>
  </div>`;

  h += `<div class="wgrid">${W_STATS.map(k => field(k)).join("")}
    ${W_SPECIAL.map(([k,hint]) => field(k, hint)).join("")}</div>`;

  h += `<div class="planbar"><span class="lbl">Score at tier</span>
    <input type="range" id="ptier" min="0" max="10" value="${state.planTier}">
    <span class="pv">+${state.planTier}</span>
    <span class="lbl" style="letter-spacing:.04em;text-transform:none">
      ranks items as if levelled this far</span></div>`;

  const filters = [];
  if(state.zones.size) filters.push(`<b>${state.zones.size} zone${state.zones.size===1?"":"s"}</b>`);
  if(state.src.size)   filters.push(`<b>${[...state.src].join(", ")}</b>`);
  if(state.inEra)      filters.push(`in-era only`);
  if(state.locked.size)filters.push(`<b>${state.locked.size} locked slot${state.locked.size===1?"":"s"}</b> untouched`);

  h += `<div class="wact">
    <button class="btn btn-brass" id="autobis">Auto-equip BiS</button>
    <button class="btn" id="fillbis">Fill empty slots only</button>
    <button class="btn" id="clearall">Clear loadout</button>
    <div class="scope">Picks run through the same filters as the browser${
      filters.length ? " — currently " + filters.join(" · ") : ", and nothing is filtered right now"
    }. Class, race and LORE are enforced; a two-hander in Primary skips Secondary.
    ${state.lastAuto?.length ? `<br><span style="color:var(--dim)">Last run filled ${state.lastAuto.length} slot${state.lastAuto.length===1?"":"s"}.</span>` : ""}</div>
  </div>`;

  el.innerHTML = h;

  el.querySelectorAll("[data-wmode]").forEach(b => b.onclick = () => {
    state.wMode = b.dataset.wmode; render();
  });
  document.getElementById("wreset").onclick = () => {
    state.weights = derivedWeights(); state.wMode = "custom"; render();
  };
  el.querySelectorAll("[data-w]").forEach(inp => {
    inp.onchange = () => {
      syncWeights();
      state.weights = {...activeWeights(), [inp.dataset.w]:(+inp.value || 0)};
      state.wMode = "custom";
      render();
      const n = document.getElementById("w_" + inp.dataset.w);
      if(n){ n.focus(); n.select(); }
    };
  });
  const pt = document.getElementById("ptier");
  pt.oninput = () => {
    state.planTier = +pt.value;
    el.querySelector(".pv").textContent = "+" + state.planTier;
  };
  pt.onchange = () => render();

  document.getElementById("autobis").onclick = () => autoBiS(false);
  document.getElementById("fillbis").onclick = () => autoBiS(true);
  document.getElementById("clearall").onclick = () => {
    for(const k of Object.keys(state.equipped)) if(!state.locked.has(k)) delete state.equipped[k];
    state.lastAuto = null; render();
  };
}

/* ---------------- render: paper doll ---------------- */
function renderDoll(){
  const act = active(), errs = {};
  issues().filter(i => i.t === "err").forEach(i => {
    const m = i.m.match(/in (EAR1|EAR2|HEAD|FACE|NECK|SHOULDERS|ARMS|BACK|WRIST1|WRIST2|RANGE|HANDS|PRIMARY|SECONDARY|FINGER1|FINGER2|CHEST|LEGS|FEET|WAIST|AMMO|ANY1|ANY2)/);
    if(m) errs[m[1]] = 1;
  });
  Object.entries(state.equipped).forEach(([k,e]) => {
    const it = byId[e.itemId];
    if(it && (it.tags.includes("LORE") || it.tags.includes("LORE_EQUIPPED"))){
      const dupes = Object.entries(state.equipped).filter(([,x]) => byId[x.itemId]?.name === it.name);
      if(dupes.length > 1) errs[k] = 1;
    }
  });

  document.getElementById("doll").innerHTML = SLOTS.map(s => {
    const e = state.equipped[s.k], it = e && byId[e.itemId];
    const sel = state.view.slot === s.k;
    const cls = ["slot", it ? "filled" : "", sel ? "sel" : "",
                 s.a === "*" ? "any" : "", errs[s.k] ? "bad" : "",
                 state.locked.has(s.k) ? "locked" : ""].join(" ");
    let inner = `<div class="slot-name">${s.n}</div>`;
    if(it){
      inner += `<div class="slot-item">${esc(it.name)}</div><div class="slot-meta">
        <span class="lvl">+${tierOf(e.xp||0)}</span>
        <span class="gems">${EXALTS.map(x =>
          `<span class="gem ${e.exalts[x.k] || (x.k==='ornament'&&e.exalts.ornament) ? "on" : ""} ${x.k==='ornament'?'orn':''}"></span>`).join("")}</span>
        ${errs[s.k] ? `<span class="flag err">!</span>` : ""}
        ${(it.tags.includes("LORE")||it.tags.includes("LORE_EQUIPPED")) ? `<span class="flag lore">Lore</span>` : ""}
        ${state.locked.has(s.k) ? `<span class="flag lk">lock</span>` : ""}
      </div>`;
    } else {
      inner += `<div class="slot-empty">${s.a === "*" ? "flex — anything" : "empty"}</div>`;
    }
    return `<button class="${cls}" data-slot="${s.k}">${inner}</button>`;
  }).join("");

  document.querySelectorAll("[data-slot]").forEach(b =>
    b.onclick = () => { state.view = {mode:"slot", slot:b.dataset.slot, exalt:null}; render(); });
}

/* ---------------- render: totals ---------------- */
const ATTRS = ["STR","STA","AGI","DEX","WIS","INT","CHA"];

/** gear contribution, at each item's current tier */
function gearStats(){
  const t = {AC:0,HP:0,MANA:0,STR:0,STA:0,AGI:0,DEX:0,WIS:0,INT:0,CHA:0};
  Object.values(state.equipped).forEach(e => {
    const it = byId[e.itemId]; if(!it) return;
    const s = scaledItem(it, e.xp||0).stats;
    for(const k in t) if(s[k]) t[k] += s[k];
  });
  return t;
}

function renderTotals(){
  const t = gearStats();
  document.getElementById("totals").innerHTML = Object.entries(t).map(([k,v]) =>
    `<div class="tot"><dt>${k}</dt><dd class="${v?"":"z"}">${v>0?"+":""}${v}</dd></div>`).join("");
}

/* ---------------- render: where the set comes from ----------------
   The counterpart to the zone filter: once gear is on, this is the farm route.
   An item that drops in three zones counts in all three — the question being
   answered is "where could I get this", not "where will I get it". */
function renderZoneSum(){
  const el = document.getElementById("zonesum");
  const eq = Object.values(state.equipped).map(e => byId[e.itemId]).filter(Boolean);
  if(!eq.length){ el.innerHTML = ""; return; }
  const c = {};
  eq.forEach(i => zonesOf(i).forEach(z => c[z] = (c[z]||0)+1));
  const rows = Object.entries(c).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
  const only = rows.filter(([,n]) => n === 1).length;
  el.innerHTML = `<b>Set draws on ${rows.length} zone${rows.length===1?"":"s"}</b>` +
    (only ? ` · ${only} contributing a single piece` : "") + `<br>` +
    rows.map(([z,n]) => `${esc(z)} <span style="color:var(--brass)">${n}</span>`).join(" · ") +
    (state.zones.size ? `<br><span style="color:var(--faint)">Browser is filtered to ${state.zones.size} zone${state.zones.size===1?"":"s"}.</span>` : "");
}

/* ---------------- render: character sheet ----------------
   base(race) + adds(class1..3) + gear. EQL has no point buy, so race and the
   three classes fully determine the naked sheet — which is the whole reason a
   triple-INT trio starts absurd. */
function renderChar(){
  const el = document.getElementById("charsheet");
  const act = active();
  const base = CHAR.races[state.race];
  const sub = document.getElementById("charsub");

  if(!base){
    sub.innerHTML = "";
    el.innerHTML = `<div class="empty"><b>Pick a race</b>Set a race above to see base attributes and what each class adds.</div>`;
    return;
  }

  const adds = {}, per = {};
  ATTRS.forEach(a => adds[a] = 0);
  act.forEach(c => {
    per[c] = CHAR.classes[c] || {};
    ATTRS.forEach(a => adds[a] += (per[c][a] || 0));
  });

  const gear = gearStats();
  const cap = CHAR.attr_cap || 150;

  /* Verified invariant: every class adds exactly 30. If an edit breaks it, say so. */
  const bad = act.filter(c => Object.values(CHAR.classes[c]||{}).reduce((a,b)=>a+b,0) !== (CHAR.class_add_total||30));
  sub.innerHTML = CHAR.verified
    ? `<span class="badge ok">verified</span>`
    : `<span class="badge" title="These are classic-EQ numbers carried over on an assumption. See chardata.json.">unverified</span>`;

  const castStats = new Set(act.map(c => CHAR.casting_stat?.[c]).filter(Boolean));

  let h = `<table class="sheet"><thead><tr><th></th><th>Base</th>
    ${act.map(c => `<th>${c}</th>`).join("")}<th>Naked</th><th>Gear</th><th>Total</th></tr></thead><tbody>`;
  for(const a of ATTRS){
    const naked = base[a] + adds[a], total = naked + (gear[a]||0);
    h += `<tr class="${castStats.has(a)?"key":""}"><td>${a}</td><td class="g">${base[a]}</td>
      ${act.map(c => `<td class="g">${per[c][a] ? "+"+per[c][a] : "·"}</td>`).join("")}
      <td>${naked}</td>
      <td class="gear">${gear[a] ? (gear[a]>0?"+":"")+gear[a] : "·"}</td>
      <td class="tot ${total > cap ? "over" : ""}">${total}${total > cap ? "‡" : ""}</td></tr>`;
  }
  h += `</tbody></table>`;

  h += `<div class="data-note">`;
  if(castStats.size){
    const pools = act.filter(c => CHAR.casting_stat?.[c])
      .map(c => `${c} (${CHAR.casting_stat[c]})`);
    h += `<b>Mana:</b> ${pools.length ? pools.join(", ") + " cast" : "no casters"}. Pools come from your
      <b>two highest</b> classes only — a third caster adds nothing. Each class works its pool off its own
      casting stat, highlighted above. The formula is unpublished, so there's no number here.<br>`;
  }
  if(act.length < 3) h += `<b>${3-act.length} class slot${act.length===2?"":"s"} empty</b> — each class is worth exactly 30 points.<br>`;
  if([...ATTRS].some(a => base[a]+adds[a]+(gear[a]||0) > cap))
    h += `‡ over the reported ${cap} ceiling. Players report it; it isn't in the client, so nothing is clamped.<br>`;
  if(bad.length) h += `<span style="color:var(--bad)"><b>chardata is off:</b> ${bad.join(", ")} don't add to ${CHAR.class_add_total||30}.</span><br>`;
  if(!CHAR.verified) h += `Attribute numbers are <b>classic EQ values, unverified for EQL</b> — the wiki doesn't publish them. Check them against your own stat window and fix <code>chardata.json</code>.`;
  h += `</div>`;
  el.innerHTML = h;
}

/* ---------------- render: rules log ---------------- */
function renderLog(){
  const is = issues();
  document.getElementById("log").innerHTML = is.map(i =>
    `<div class="issue ${i.t}"><span class="ico">${i.ico}</span><span>${i.m}</span></div>`).join("");
  const e = is.filter(i => i.t === "err").length, w = is.filter(i => i.t === "warn").length;
  document.getElementById("logsub").textContent =
    e || w ? `${e} blocking · ${w} to watch` : "all clear";
}

/* ---------------- render: drawer ---------------- */
function renderDrawer(){
  const d = document.getElementById("drawer");
  const {slot, exalt} = state.view;

  if(!slot){
    document.getElementById("dtitle").textContent = "Browser";
    document.getElementById("dsub").textContent = "";
    d.innerHTML = `<div class="empty"><b>Pick a slot</b>Click any slot on the left to see the gear that fits it, filtered to your classes and race.</div>`;
    return;
  }
  const sdef = SLOTS.find(s => s.k === slot);
  const entry = state.equipped[slot];

  /* --- exaltation source picker --- */
  if(exalt && entry){
    const ex = EXALTS.find(x => x.k === exalt);
    const eff = effective(entry);
    document.getElementById("dtitle").textContent = ex.n + " exaltation";
    document.getElementById("dsub").textContent = eff.base.name;

    let h = `<button class="back" id="back">&larr; back to ${esc(eff.base.name)}</button>`;
    if(ex.k === "ornament"){
      h += `<div class="note"><b>Cosmetic only.</b> ${ex.note}<br><br>The wiki currently notes: <i>"Ornamentation Tokens are not currently available."</i></div>`;
      d.innerHTML = h; document.getElementById("back").onclick = back; return;
    }

    const cands = DATA.items.filter(i => i.effects?.[ex.src]);
    const scored = cands.map(i => {
      const c = cx(eff.classes, i.classes), s = sx(eff.slots, i.slots);
      const slotOk = sdef.a === "*" ? true : (s && s.includes(sdef.a));
      const ok = c.length > 0 && s && s.length > 0 && slotOk && usableBy(c, active());
      let why = "";
      if(!c.length) why = `No shared class with ${eff.base.name}.`;
      else if(!s || !s.length) why = `Slot restriction (${i.slots.join("/")}) can't meet ${eff.slots.join("/")}.`;
      else if(!slotOk) why = `Would force ${eff.base.name} to ${s.join("/")} — not ${sdef.n}.`;
      else if(!usableBy(c, active())) why = `Result usable only by ${c.join("/")}.`;
      return {i, ok, why, c, s};
    }).sort((a,b) => (b.ok - a.ok) || a.i.name.localeCompare(b.i.name));

    h += `<div class="note"><b>Unlocks at +${ex.req}.</b> Level a second copy of the source item to +${ex.req}, then its ${ex.n.toLowerCase()} becomes a removable exaltation. Sockets here only if it shares a class and a legal slot.</div>`;

    if(!scored.length){
      h += `<div class="empty"><b>No ${ex.n.toLowerCase()} sources</b>The loaded data has no items with a ${ex.n.toLowerCase()} effect. Load the full scrape to populate this.</div>`;
    } else {
      h += scored.map(({i, ok, why, c, s}) => {
        const eff2 = i.effects[ex.src];
        return `<button class="row ${ok?"":"ineligible"}" data-src="${i.id}" ${ok?"":"disabled"}>
          <div class="row-top"><span class="row-name">${esc(eff2.name)}</span>
            <span class="row-stat">+${ex.req}</span></div>
          <div class="row-sub">from <b style="color:var(--dim)">${esc(i.name)}</b> · ${showList(i.classes)} · ${i.slots.join("/")}
            ${eff2.level ? " · L"+eff2.level : ""}</div>
          <div class="row-drop">${dropLine(i) || "No drop data on wiki"}</div>
          ${ok ? (c.join("/") !== eff.classes.join("/") || s.join("/") !== eff.slots.join("/")
              ? `<div class="row-sub" style="color:var(--warn)">⚠ narrows target to ${c.join("/")} · ${s.join("/")}</div>` : "")
            : `<div class="row-sub" style="color:var(--bad)">✕ ${why}</div>`}
        </button>`;
      }).join("");
    }
    d.innerHTML = h;
    document.getElementById("back").onclick = back;
    d.querySelectorAll("[data-src]").forEach(b => b.onclick = () => {
      state.equipped[slot].exalts[exalt] = b.dataset.src;
      state.view.exalt = null; render();
    });
    return;
  }

  /* --- equipped item detail + exaltation rail --- */
  if(entry){
    const eff = effective(entry), it = eff.base;
    document.getElementById("dtitle").textContent = sdef.n;
    document.getElementById("dsub").textContent = `+${eff.sc.tier} · ${(eff.sc.cum*100).toFixed(1)}%`;

    let tip = "";
    if(it.tags.length) tip += `<span class="t-tag">${it.tags.map(t=>t.replace("_"," ")+" ITEM").join(" ")}</span>\n`;
    tip += `<span class="t-key">Slot:</span> ${eff.slots.join(" ")}\n`;
    if(it.skill) tip += `<span class="t-key">Skill:</span> ${it.skill}  <span class="t-key">Atk Delay:</span> ${it.delay}\n`;
    if(it.dmg) tip += `<span class="t-key">DMG:</span> ${eff.sc.dmg}${eff.sc.dmg!==it.dmg?`<span class="delta"> (+${eff.sc.dmg-it.dmg})</span>`:""}` +
      (it.delay ? `  <span class="t-key">Ratio:</span> ${(eff.sc.dmg/it.delay).toFixed(2)}` : "") + `\n`;
    const st = Object.entries(eff.sc.stats||{}).map(([k,v]) => {
      const b = it.stats[k], d = v - b;
      return `${k}: ${v>0?"+":""}${v}${d ? `<span class="delta${d<0?" neg":""}"> (${d>0?"+":""}${d})</span>` : ""}`;
    }).join("  ");
    if(st) tip += st + "\n";
    if(it.charges) tip += `<span class="t-key">Charges:</span> ${it.charges}\n`;
    if(it.wt != null) tip += `<span class="t-key">WT:</span> ${eff.sc.wt}  <span class="t-key">Size:</span> ${it.size||"—"}\n`;
    tip += `<span class="t-key">Class:</span> ${eff.classes.join(" ")}\n`;
    tip += `<span class="t-key">Race:</span> ${showList(it.races)}\n`;
    if(it.effects?.focus) tip += `<span class="t-foc">Focus Effect: ${esc(it.effects.focus.name)}</span>\n`;
    ["proc","click","worn"].forEach(t => { if(it.effects?.[t])
      tip += `<span class="t-eff">Effect: ${esc(it.effects[t].name)} (${esc(it.effects[t].detail||t)})</span>\n`; });

    let h = `<div class="tip"><div class="tip-name">${esc(it.name)}</div><pre>${tip.trim()}</pre></div>`;

    const tier = eff.sc.tier;
    h += `<div class="rail"><div class="rail-h"><h3>Tier</h3>
      <div class="tierpick">${TIER_XP.map((x,l) =>
        `<button data-lvl="${l}" class="${tier===l?"on":""} ${l>4?"gated":""}" title="${TIER_XP[l]} xp">+${l}</button>`).join("")}</div></div>`;

    h += `<div class="xpbar"><input type="range" id="xp" min="0" max="${MAX_XP}" value="${entry.xp||0}">
      <span class="xpv">${entry.xp||0} / ${MAX_XP} xp</span></div>`;

    if(tier < 10){
      const need = TIER_XP[tier+1] - (entry.xp||0);
      const mote = [...MOTES].reverse().find(m => tier <= m.max);
      h += `<div class="note"><b>+${tier} → +${tier+1}: ${need} more xp.</b>
        Merging a duplicate at +${tier} gives ${TIER_XP[tier]||1} xp${tier>=1?` — a copy at +${tier+1} gives ${TIER_XP[tier+1]}`:""}.
        ${mote ? `Best mote that still feeds this: <b>Mote of ${mote.n} Potential</b> (${mote.xp} xp, caps at +${mote.max}) — ${Math.ceil(need/mote.xp)} of them.` : `No mote can feed an item this high; only duplicates work.`}
        Stats creep up as xp lands, not just on ding.</div>`;
    }

    h += `<div class="rail"><div class="rail-h"><h3>Exaltations</h3><div class="sub">sockets open by tier</div></div>`;

    h += EXALTS.map(x => {
      const locked = eff.sc.tier < x.req;
      const srcId = entry.exalts[x.k], src = srcId && byId[srcId];
      const val = x.k === "ornament"
        ? (src ? src.name + " (appearance)" : null)
        : (src ? `${src.effects[x.src].name} — from ${src.name}` : null);
      return `<div class="exalt ${locked?"locked":""} ${src?"set":"open"} ${x.k==='ornament'?'orn-s':''}"
                data-ex="${locked?"":x.k}">
        <span class="socket">${locked ? "🔒" : (src ? "" : "+"+x.req)}</span>
        <span class="ex-txt"><span class="ex-type">${x.n}</span>
          <span class="ex-val ${val?"":"none"}">${val ? esc(val) : (locked ? `locked — needs +${x.req}` : "empty · click to fit")}</span></span>
        ${src ? `<button class="ex-clear" data-clr="${x.k}">clear</button>` : `<span class="ex-req">+${x.req}</span>`}
      </div>`;
    }).join("") + `</div>`;

    if(tier < 4)
      h += `<div class="note"><b>+${tier} of +4 for sockets.</b> The last exaltation socket opens at +4, but stats keep climbing to +10 — at +10 every stat is double its tier-0 value.</div>`;

    eff.applied.forEach(a => {
      if(a.narrowedClass || a.narrowedSlot)
        h += `<div class="note warn"><b>${esc(a.src.name)}</b>'s ${a.type.n.toLowerCase()} carried its own restrictions onto ${esc(it.name)}: now <b>${eff.classes.join("/")}</b> · <b>${eff.slots.join("/")}</b>. This is not cosmetic — it changes where the item can be worn.</div>`;
    });

    if(it.crafted_by?.length)
      h += `<div class="note"><b>Player crafted.</b> ${it.crafted_by.slice(0,3).map(esc).join("<br>")}</div>`;
    /* how this piece rates against what else could sit here, under your weights */
    const rivals = bisCandidates(slot, new Set(), {ignoreTwoHand:true})
      .filter(c => c.i.id !== it.id).slice(0, 3);
    const mine = slotScore(it, slot);
    h += `<div class="note"><b>${slot === "SECONDARY" ? "Offhand value" : "BiS score"}
      ${mine.toFixed(0)}</b> at +${state.planTier}, under your
      ${state.wMode === "custom" ? "custom" : "class-derived"} weights.
      ${slot === "SECONDARY" && isWeapon(it)
        ? `Damage counted at ${(offhandFactor()*100).toFixed(0)}%${offhandFactor()?"":" — nothing in this trio dual wields"}; stats and effects in full. `
        : ""}
      ${rivals.length ? "Next best here: " + rivals.map(r =>
        `${esc(r.i.name)} <span class="score">${r.s.toFixed(0)}</span>`).join(" · ") +
        "." : "Nothing else passes the current filters for this slot."}</div>`;

    /* the pair comparison, shown from either hand */
    if(slot === "PRIMARY" || slot === "SECONDARY"){
      const hands = pickHands();
      if(hands && hands.rival != null){
        /* "dual wield" only if the trio can actually dual wield AND the offhand
           is a weapon — a paladin holding a shield, or a wizard holding a second
           wand, is a one-hand-plus-offhand build, not a dual wield one. */
        const win = hands.mode === "two-hand" ? "Two-hander"
          : (offhandFactor() > 0 && hands.offhand && isWeapon(hands.offhand.i))
            ? "Dual wield" : "One-hand + offhand";
        h += `<div class="note ${hands.mode === "dual" ? "" : "warn"}">
          <b>${win} wins these two slots: ${hands.total.toFixed(0)} vs ${hands.rival.toFixed(0)}.</b>
          ${hands.mode === "dual"
            ? `${esc(hands.primary.i.name)}${hands.offhand?` + ${esc(hands.offhand.i.name)}`:" with an empty offhand"} —
               a two-hander has to beat both hands together, not just the mainhand.`
            : `${esc(hands.primary.i.name)} out-scores the best pair, so the offhand stays empty.`}
          Auto-equip resolves both hands together; lock a slot to overrule it.</div>`;
      }
    }

    h += `<div class="lockrow"><button id="lockslot" class="${state.locked.has(slot)?"on":""}">
      ${state.locked.has(slot) ? "Locked — auto-equip skips this slot" : "Lock this slot against auto-equip"}
    </button></div>`;

    h += `<button class="row" id="unequip" style="color:var(--bad)"><div class="row-top"><span class="row-name">Remove ${esc(it.name)}</span></div></button>`;
    h += `<div class="data-note">Source: <a href="${it.url}" target="_blank" rel="noopener">${it.url.replace("https://","")}</a></div>`;

    d.innerHTML = h;
    const setXp = v => {
      entry.xp = Math.max(0, Math.min(MAX_XP, v));
      const t = tierOf(entry.xp);
      EXALTS.forEach(x => { if(t < x.req) entry.exalts[x.k] = null; });
      render();
    };
    d.querySelectorAll("[data-lvl]").forEach(b => b.onclick = () => setXp(TIER_XP[+b.dataset.lvl]));
    const xpEl = document.getElementById("xp");
    if(xpEl) xpEl.oninput = () => {
      entry.xp = +xpEl.value;
      const t = tierOf(entry.xp);
      EXALTS.forEach(x => { if(t < x.req) entry.exalts[x.k] = null; });
      renderDoll(); renderTotals(); renderChar(); renderLog();
      d.querySelector(".xpv").textContent = `${entry.xp} / ${MAX_XP} xp`;
      document.getElementById("dsub").textContent = `+${t} · ${(cumBonus(entry.xp)*100).toFixed(1)}%`;
    };
    if(xpEl) xpEl.onchange = () => render();
    d.querySelectorAll("[data-ex]").forEach(el => { if(el.dataset.ex) el.onclick = ev => {
      if(ev.target.dataset.clr) return;
      state.view.exalt = el.dataset.ex; render();
    };});
    d.querySelectorAll("[data-clr]").forEach(b => b.onclick = ev => {
      ev.stopPropagation(); entry.exalts[b.dataset.clr] = null; render();
    });
    document.getElementById("lockslot").onclick = () => {
      state.locked.has(slot) ? state.locked.delete(slot) : state.locked.add(slot);
      render();
    };
    document.getElementById("unequip").onclick = () => {
      delete state.equipped[slot]; state.locked.delete(slot); render(); };
    return;
  }

  /* --- gear list for an empty slot --- */
  document.getElementById("dtitle").textContent = sdef.n + (sdef.a === "*" ? " (flex)" : "");
  const act = active();
  let pool = DATA.items.filter(i => fitsSlot(i, slot));
  const hiddenEra = state.inEra ? pool.filter(outOfEra).length : 0;
  if(state.inEra) pool = pool.filter(i => !outOfEra(i));
  if(state.q) pool = pool.filter(i =>
    (i.name + " " + (i.drops||[]).map(x=>x.zone+" "+x.mobs.join(" ")).join(" ")).toLowerCase()
      .includes(state.q.toLowerCase()));

  /* Facet counts are computed with every filter EXCEPT the facet's own applied,
     so a count tells you what you'd get by clicking, not what you already have. */
  const bySrc  = i => !state.src.size   || (i.source||[]).some(s => state.src.has(s));
  const byZone = i => !state.zones.size || zonesOf(i).some(z => state.zones.has(z));

  const srcCounts = {};
  pool.filter(byZone).forEach(i => (i.source||[]).forEach(s => srcCounts[s] = (srcCounts[s]||0)+1));
  const zoneCounts = {};
  pool.filter(bySrc).forEach(i => zonesOf(i).forEach(z => zoneCounts[z] = (zoneCounts[z]||0)+1));

  const preFilter = pool.length;
  pool = pool.filter(bySrc).filter(byZone);

  const scored = pool.map(i => {
    let ok = true, why = "";
    if(!usableBy(i.classes, act)){ ok = false; why = `Needs ${showList(i.classes)}`; }
    else if(!raceOk(i, state.race)){ ok = false; why = `${showList(i.races)} only`; }
    else {
      const dupe = Object.entries(state.equipped).find(([k,e]) =>
        byId[e.itemId]?.name === i.name &&
        (i.tags.includes("LORE") || i.tags.includes("LORE_EQUIPPED")));
      if(dupe){ ok = false; why = `LORE — already equipped in ${dupe[0]}`; }
    }
    return {i, ok, why, k:sortKey(i, act)};
  }).sort((a,b) => (b.ok - a.ok) || (b.k - a.k) || a.i.name.localeCompare(b.i.name));

  const nFilt = (state.zones.size ? 1 : 0) + (state.src.size ? 1 : 0);
  document.getElementById("dsub").textContent =
    `${scored.filter(s=>s.ok).length} usable / ${pool.length}` +
    (nFilt ? ` of ${preFilter}` : "");

  const SRC = [["drop","Drops"],["quest","Quest"],["vendor","Vendor"],["craft","Crafted"],["forage","Forage"]];
  let h = `<div class="search"><input type="search" id="q" placeholder="Filter by name, zone or mob…" value="${esc(state.q)}"></div>`;

  /* ---- zone facet ---- */
  const zAll = Object.entries(zoneCounts)
    .sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  h += `<div class="fbar">
    <button class="fbtn ${state.zones.size?"on":""}" id="zbtn">
      <span>${state.zones.size ? `Zones · ${state.zones.size} selected` : "Zones · all"}</span>
      <span class="cnt">${state.zoneOpen?"▴":"▾"} ${zAll.length}</span></button>
    ${state.zones.size?`<button class="clr" id="zclr">clear</button>`:""}</div>`;

  if(state.zoneOpen){
    const q = state.zoneQ.toLowerCase();
    let list = zAll.filter(([z]) => !q || z.toLowerCase().includes(q));
    const CAPZ = 60, over = Math.max(0, list.length - CAPZ);
    list = list.slice(0, CAPZ);
    /* A selected zone must stay visible even when this slot has nothing in it,
       or you can't untick it without clearing the whole filter. */
    for(const z of state.zones)
      if(!list.some(([n]) => n === z)) list.push([z, zoneCounts[z] || 0]);
    h += `<div class="zpanel">
      <input type="search" id="zq" placeholder="Find a zone…" value="${esc(state.zoneQ)}">
      <div class="zlist">${list.map(([z,n]) =>
        `<button class="zchip ${state.zones.has(z)?"on":""} ${n?"":"dim"}" data-zone="${esc(z)}">
          ${esc(z)} <span class="n">${n}</span></button>`).join("")}
        ${over?`<div class="zmore">+${over} more — type above to narrow.</div>`:""}
        ${zAll.length?"":`<div class="zmore">No zone data for this slot.</div>`}</div></div>`;
  }

  h += `<div class="sortbar"><label for="sort">Sort</label><select id="sort">${SORTS.map(([k,l]) =>
      `<option value="${k}" ${state.sort===k?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="chips">${SRC.map(([k,l]) =>
      `<button class="chip ${state.src.has(k)?"on":""}" data-srcf="${k}" title="${srcCounts[k]||0} here">${l}${srcCounts[k]?` · ${srcCounts[k]}`:""}</button>`).join("")}
      <button class="chip era ${state.inEra?"on":""}" id="erachip" title="Hide Kunark/Velious gear that isn't in EQ Legends yet">
        ${state.inEra ? `In era only${hiddenEra?` · ${hiddenEra} hidden`:""}` : "Showing out-of-era"}</button></div>`;

  if(state.zones.size)
    h += `<div class="note"><b>Filtered to ${state.zones.size} zone${state.zones.size===1?"":"s"}:</b>
      ${[...state.zones].map(esc).join(" · ")}.<br>This sticks as you click through slots — build the whole set out of one route, then clear it.</div>`;
  if(sdef.a === "*")
    h += `<div class="note"><b>Any slot.</b> Takes any equippable item at full stats — a second shield for AC, a spare breastplate, a boot dagger for backstab. Class and race rules still apply.</div>`;

  if(!scored.length){
    h += `<div class="empty"><b>Nothing here</b>${DATA.seed
      ? "The built-in seed only holds a handful of verified items. Run <code>scrape_eqlwiki.py</code> and load the result to browse the full database."
      : "No items match this slot and filter."}</div>`;
  } else {
    const CAP = 150, shown = scored.slice(0, CAP);
    if(scored.length > CAP)
      h += `<div class="note"><b>Showing ${CAP} of ${scored.length}.</b> Type above to narrow by name, zone or mob — or use the filters.</div>`;
    h += shown.map(({i, ok, why}) => `<button class="row ${ok?"":"ineligible"}" data-eq="${i.id}" ${ok?"":"disabled"}>
      <div class="row-top"><span class="row-name">${esc(i.name)}</span><span class="row-stat">${sortStat(i)}</span></div>
      <div class="row-sub">${tagPills(i)} ${showList(i.classes)} ${i.races.includes("ALL")?"":"· "+showList(i.races)}
        ${i.effects?.focus?`<span class="pill foc">Focus</span>`:""}
        ${i.effects?.proc?`<span class="pill foc">Proc</span>`:""}
        ${i.effects?.click?`<span class="pill foc">Click</span>`:""}
        ${i.effects?.worn?`<span class="pill foc">Worn</span>`:""}</div>
      <div class="row-drop">${dropLine(i) || "No drop data on wiki"}</div>
      ${ok?"":`<div class="row-sub" style="color:var(--bad)">✕ ${why}</div>`}
    </button>`).join("");
  }
  d.innerHTML = h;
  const ec = document.getElementById("erachip");
  if(ec) ec.onclick = () => { state.inEra = !state.inEra; renderDrawer(); };
  const so = document.getElementById("sort");
  if(so) so.onchange = () => { state.sort = so.value; renderDrawer(); };

  const zb = document.getElementById("zbtn");
  if(zb) zb.onclick = () => { state.zoneOpen = !state.zoneOpen; renderDrawer(); };
  const zc = document.getElementById("zclr");
  if(zc) zc.onclick = () => { state.zones.clear(); render(); };
  d.querySelectorAll("[data-zone]").forEach(b => b.onclick = () => {
    const z = b.dataset.zone;
    state.zones.has(z) ? state.zones.delete(z) : state.zones.add(z);
    render();                       // totals summary tracks the filter too
  });
  const zq = document.getElementById("zq");
  if(zq) zq.oninput = () => { state.zoneQ = zq.value; renderDrawer();
    const n = document.getElementById("zq"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
  d.querySelectorAll("[data-srcf]").forEach(b => b.onclick = () => {
    const k = b.dataset.srcf;
    state.src.has(k) ? state.src.delete(k) : state.src.add(k);
    renderDrawer();
  });
  const q = document.getElementById("q");
  q.oninput = () => { state.q = q.value; renderDrawer();
    const n = document.getElementById("q"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
  d.querySelectorAll("[data-eq]").forEach(b => b.onclick = () => {
    state.equipped[slot] = {itemId:b.dataset.eq, xp:0,
      exalts:{ornament:null,focus:null,click:null,worn:null,proc:null}};
    state.q = ""; render();
  });
}
const back = () => { state.view.exalt = null; render(); };

/* ---------------- data note ---------------- */
function renderDataNote(){
  document.getElementById("datanote").innerHTML = DATA.seed
    ? `<b>Running on the built-in seed — ${DATA.items.length} items.</b> These four are hand-verified against eqlwiki so the rules engine has something real to chew on (they reproduce the wiki's own Earthshaker → Short Sword of the Ykesha example exactly).<br><br>
       For the real thing, run <code>scrape_eqlwiki.py</code> — it pulls every equippable item from eqlwiki (stats, tags, class/race, focus/click/worn/proc effects, and the zone + mob each one drops from), then hit <b>Load item data</b>. The wiki is live, so you get this week's Crushbone and Splitpaw drops.<br>
       <code>python scrape_eqlwiki.py --zone Crushbone</code> for a quick targeted pull.`
    : `<b>Loaded ${DATA.items.length} items</b> from ${esc(DATA.source||"file")}${DATA.scraped?` · scraped ${esc(DATA.scraped)}`:""}. Re-run the scraper to refresh after a patch.
       <br><br>Tier 0-10 stats are computed here from each item's tier-0 block, not read from the file — the wiki only ever lists tier 0. ${DATA.tiers_included?"This file also carries a baked <code>tiers</code> array; the planner ignores it and recomputes.":""}`;
}

/* ---------------- boot ---------------- */
function render(){ renderWeights(); renderDoll(); renderTotals(); renderZoneSum(); renderChar(); renderLog(); renderDrawer(); renderDataNote();
  document.getElementById("dollsub").textContent =
    `${Object.keys(state.equipped).length}/${SLOTS.length} slots · ${active().join(" / ")}`;
}

function initControls(){
  ["c1","c2","c3"].forEach((id, n) => {
    const s = document.getElementById(id);
    s.innerHTML = `<option value="">— none —</option>` +
      Object.entries(CLASSES).map(([k,v]) => `<option value="${k}">${v}</option>`).join("");
    s.value = state.classes[n] || "";
    s.onchange = () => { state.classes[n] = s.value; render(); };
  });
  const r = document.getElementById("race");
  r.innerHTML = Object.entries(RACES).map(([k,v]) => `<option value="${k}">${v}</option>`).join("");
  r.value = state.race;
  r.onchange = () => { state.race = r.value; render(); };

  const cf = document.getElementById("charfile");
  document.getElementById("loadchar").onclick = () => cf.click();
  cf.onchange = () => {
    const file = cf.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const j = JSON.parse(rd.result);
        if(!j.races || !j.classes) throw new Error("expecting races{} and classes{}");
        const total = j.class_add_total || 30;
        const bad = Object.entries(j.classes).filter(([,v]) =>
          Object.values(v).reduce((a,b)=>a+b,0) !== total).map(([k])=>k);
        if(bad.length && !confirm(
          `These classes don't add up to ${total}: ${bad.join(", ")}.\n\n` +
          `Every EQL class is worth exactly ${total} points, so that's probably a typo. Load anyway?`)) return;
        CHAR = j; render();
      }catch(e){ alert("Couldn't read that file: " + e.message + "\n\nExpecting chardata.json."); }
    };
    rd.readAsText(file);
  };

  const f = document.getElementById("file");
  document.getElementById("load").onclick = () => f.click();
  f.onchange = () => {
    const file = f.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const j = JSON.parse(rd.result);
        const items = Array.isArray(j) ? j : j.items;
        if(!Array.isArray(items)) throw new Error("no items array");
        DATA = {source:j.source||file.name, scraped:j.scraped, items, seed:false};
        reindex(); state.equipped = {}; state.view = {mode:"slot",slot:null,exalt:null};
        render();
      }catch(e){
        alert("Couldn't read that file: " + e.message +
          "\n\nExpecting items.json from scrape_eqlwiki.py.");
      }
    };
    rd.readAsText(file);
  };
}




async function autoLoadHostedData() {
  try {
    // 1. Fetch the items data
    const itemRes = await fetch('./items.json');
    if (itemRes.ok) {
      const j = await itemRes.json();
      const items = Array.isArray(j) ? j : (j.items || []);
      DATA = {
        source: j.source || "GitHub Pages Hosted", 
        scraped: j.scraped || new Date().toISOString(), 
        items: items, 
        seed: false
      };
      // Rebuild the data index with the new items
      reindex(); 
    } else {
      console.warn("items.json not found. status:", itemRes.status);
    }

    // 2. Fetch the character data
    const charRes = await fetch('./chardata.json');
    if (charRes.ok) {
      CHAR = await charRes.json();
    } else {
      console.warn("chardata.json not found. Using defaults.");
    }
  } catch (err) {
    console.error("Error processing hosted data:", err);
  }
  
  // 3. INITIALIZE controls and RENDER only AFTER all data is perfectly loaded!
  initControls();
  render();
}

// Kick off the auto-load
autoLoadHostedData();
</script>
